server.port=${PORT:8081}
server.address=${SERVER_ADDRESS:127.0.0.1}
spring.application.name=identidad
eureka.client.service-url.defaultZone=${EUREKA_URL:http://127.0.0.1:8761/eureka/}
eureka.instance.hostname=localhost
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/induztek_identidad}
spring.datasource.username=${DB_USER:induztek_identidad}
spring.datasource.password=${DB_PASSWORD:}
server.error.include-message=never
induztek.identidad-url=${IDENTIDAD_URL:http://127.0.0.1:8081}

spring.mail.properties.mail.smtp.connectiontimeout=4000
spring.mail.properties.mail.smtp.timeout=4000
spring.mail.properties.mail.smtp.writetimeout=4000
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true