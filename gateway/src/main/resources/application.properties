server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}
spring.application.name=gateway
eureka.client.service-url.defaultZone=${EUREKA_URL:http://127.0.0.1:8761/eureka/}
eureka.instance.hostname=localhost
eureka.client.register-with-eureka=false
spring.cloud.gateway.routes[0].id=identidad-0
spring.cloud.gateway.routes[0].uri=lb://identidad
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/sesiones,/api/sesion,/api/usuarios,/api/personal,/api/clientes
spring.cloud.gateway.routes[3].id=identidad-3
spring.cloud.gateway.routes[3].uri=lb://identidad
spring.cloud.gateway.routes[3].predicates[0]=Path=/identidad/v3/api-docs/**
spring.cloud.gateway.routes[3].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[1].id=protocolos-1
spring.cloud.gateway.routes[1].uri=lb://protocolos
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/registros,/api/sincronizacion
spring.cloud.gateway.routes[4].id=protocolos-4
spring.cloud.gateway.routes[4].uri=lb://protocolos
spring.cloud.gateway.routes[4].predicates[0]=Path=/protocolos/v3/api-docs/**
spring.cloud.gateway.routes[4].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[2].id=bitacora-2
spring.cloud.gateway.routes[2].uri=lb://bitacora
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/bitacora
spring.cloud.gateway.routes[5].id=bitacora-5
spring.cloud.gateway.routes[5].uri=lb://bitacora
spring.cloud.gateway.routes[5].predicates[0]=Path=/bitacora/v3/api-docs/**
spring.cloud.gateway.routes[5].filters[0]=StripPrefix=1
